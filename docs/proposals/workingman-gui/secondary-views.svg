<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>workingman GUI wireframe: secondary views (inbox, intake, timeline, PRs)</title>
  <defs>
    <style>
      .frame { fill: #ffffff; stroke: #9ca3af; }
      .panel { fill: #f9fafb; stroke: #d1d5db; }
      .muted { fill: #6b7280; }
      .h2 { font-size: 14px; font-weight: bold; fill: #111827; }
      .h3 { font-size: 12px; font-weight: bold; fill: #111827; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 11px; }
      .btn { fill: #ffffff; stroke: #6b7280; }
      .row { fill: #ffffff; stroke: #e5e7eb; }
      .hl { fill: #fff7ed; stroke: #c2410c; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1279" height="759" class="frame"/>
  <rect x="0.5" y="0.5" width="1279" height="44" fill="#111827"/>
  <text x="18" y="28" fill="#ffffff" font-size="16" font-weight="bold">workingman</text>
  <text x="140" y="28" fill="#d1d5db">Projects</text>
  <text x="220" y="28" fill="#d1d5db">Sandboxes</text>
  <text x="310" y="28" fill="#d1d5db">Agents</text>
  <text x="380" y="28" fill="#ffffff" font-weight="bold">Inbox</text>
  <text x="456" y="28" fill="#ffffff" font-weight="bold">Timeline</text>
  <text x="560" y="28" fill="#9ca3af" font-size="11">(four secondary views shown side by side for the sketch)</text>

  <!-- INBOX -->
  <rect x="16" y="58" width="616" height="330" rx="8" class="panel"/>
  <text x="30" y="82" class="h2">Inbox (post-office, recipient operator)</text>
  <text x="380" y="82" class="muted" font-size="10">GET /messages · message.* SSE</text>

  <rect x="30" y="94" width="588" height="168" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="40" y="104" width="62" height="18" rx="9" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="50" y="117" font-size="10" fill="#7c3aed">request</text>
  <text x="112" y="117" class="h3">from step-up · on behalf of gui-api-session-relay</text>
  <text x="520" y="117" class="muted" font-size="10">expires in 23h</text>
  <text x="40" y="142" font-size="11">Allow network to proxy.golang.org for sandbox gui-api-session-relay?</text>
  <rect x="40" y="152" width="568" height="30" rx="4" fill="#0b1220"/>
  <text x="50" y="171" fill="#e5e7eb" class="mono">network allow proxy.golang.org  sandbox=gui-api-session-relay</text>
  <text x="40" y="200" class="muted" font-size="10">exact change line, shown verbatim; the executor applies only this line, once</text>
  <text x="40" y="216" class="muted" font-size="10">reason given by the task agent: "go mod download fails: module fetch blocked"</text>
  <rect x="40" y="226" width="80" height="26" rx="4" fill="#047857"/>
  <text x="56" y="243" fill="#ffffff">Approve</text>
  <rect x="128" y="226" width="64" height="26" rx="4" class="btn"/>
  <text x="145" y="243">Deny</text>
  <rect x="200" y="226" width="96" height="26" rx="4" class="btn"/>
  <text x="212" y="243">Reply…</text>
  <text x="310" y="243" class="muted" font-size="10">no "approve all" · first answer wins (TUI, phone, GUI)</text>

  <rect x="30" y="272" width="588" height="50" rx="6" class="row"/>
  <rect x="40" y="282" width="78" height="18" rx="9" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="48" y="295" font-size="10">notification</text>
  <text x="128" y="295" class="h3">from task nightly-deps-bump</text>
  <text x="40" y="314" font-size="11" class="muted">Bumped 4 modules; 1 needs a major version, left as is.</text>
  <rect x="548" y="284" width="60" height="24" rx="4" class="btn"/>
  <text x="557" y="300">Dismiss</text>

  <rect x="30" y="332" width="588" height="44" rx="6" class="row"/>
  <text x="40" y="352" class="muted" font-size="11">closed · answered via whatsapp · 08:02</text>
  <text x="40" y="368" class="muted" font-size="11">step-up: allow network registry.npmjs.org → approved, 1 rule persisted</text>

  <!-- INTAKE -->
  <rect x="648" y="58" width="616" height="330" rx="8" class="panel"/>
  <text x="662" y="82" class="h2">Intake · gui-api</text>
  <text x="1000" y="82" class="muted" font-size="10">POST /projects/{id}/intake</text>
  <rect x="662" y="94" width="588" height="120" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="674" y="114" class="muted" font-size="11">New request (markdown) — becomes intake/&lt;name&gt;.md</text>
  <text x="674" y="136" font-size="11">Add a read-only dark-mode theme to the GUI shell. Keep</text>
  <text x="674" y="152" font-size="11">it in the same bundle; no CDN fonts.</text>
  <text x="674" y="176" class="muted" font-size="10">name: gui-20261125-0931-a1f3.md</text>
  <rect x="1150" y="180" width="88" height="26" rx="4" fill="#1d4ed8"/>
  <text x="1166" y="197" fill="#ffffff">Queue it</text>
  <text x="674" y="204" class="muted" font-size="10">project is working → a planner runs alongside running tasks</text>

  <text x="662" y="238" class="h3">Requests</text>
  <rect x="662" y="246" width="588" height="34" rx="4" class="row"/>
  <rect x="672" y="254" width="58" height="18" rx="9" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="680" y="267" font-size="10">pending</text>
  <text x="740" y="267" class="mono">gui-20261125-0931-a1f3.md</text>
  <text x="1080" y="267" class="muted" font-size="10">Withdraw (best-effort)</text>
  <rect x="662" y="286" width="588" height="34" rx="4" class="row"/>
  <rect x="672" y="294" width="70" height="18" rx="9" fill="#dcfce7" stroke="#15803d"/>
  <text x="678" y="307" font-size="10">processed</text>
  <text x="752" y="307" class="mono">add-sandbox-card.processed</text>
  <text x="1010" y="307" class="muted" font-size="10">→ planned tasks: session-relay ▸</text>
  <text x="662" y="342" class="muted" font-size="10">The task link is inferred (tasks created by the planning run that renamed the file);</text>
  <text x="662" y="356" class="muted" font-size="10">intake files carry no back-reference today, so this is best-effort.</text>
  <text x="662" y="376" class="muted" font-size="10">New project uses the same form at the root level: writes &lt;root&gt;/&lt;name&gt;/project.md.</text>

  <!-- TIMELINE -->
  <rect x="16" y="402" width="616" height="344" rx="8" class="panel"/>
  <text x="30" y="426" class="h2">Timeline (audit)</text>
  <text x="200" y="426" class="muted" font-size="10">GET /audit?since= · SSE types=audit · filter: project gui-api ▾  events ▾</text>

  <line x1="96" y1="442" x2="96" y2="732" stroke="#d1d5db" stroke-width="2"/>
  <text x="30" y="458" class="mono" fill="#6b7280">09:31:05</text>
  <circle cx="96" cy="454" r="5" fill="#0f766e"/>
  <text x="110" y="458" class="mono">integration_started</text><text x="270" y="458" font-size="11">api-read-endpoints → gui-api</text>
  <text x="30" y="486" class="mono" fill="#6b7280">09:31:05</text>
  <circle cx="96" cy="482" r="5" fill="#1d4ed8"/>
  <text x="110" y="486" class="mono">session_started</text><text x="270" y="486" font-size="11">commit-api-read-endpoints</text>
  <rect x="104" y="498" width="514" height="40" rx="4" class="hl"/>
  <text x="30" y="516" class="mono" fill="#6b7280">09:18:44</text>
  <circle cx="96" cy="512" r="6" fill="#c2410c"/>
  <text x="112" y="516" class="mono" fill="#c2410c">task_retry</text><text x="270" y="516" font-size="11">auth-token attempt 2/3</text>
  <text x="112" y="531" font-size="10" class="muted">failure_reason: "go test: token file mode 0644, want 0600"</text>
  <text x="30" y="560" class="mono" fill="#6b7280">09:12:30</text>
  <circle cx="96" cy="556" r="5" fill="#15803d"/>
  <text x="110" y="560" class="mono">integration_succeeded</text><text x="270" y="560" font-size="11">snapshot-model 8be04d1</text>
  <text x="30" y="588" class="mono" fill="#6b7280">09:02:10</text>
  <circle cx="96" cy="584" r="5" fill="#6b7280"/>
  <text x="110" y="588" class="mono">intake_queued</text><text x="270" y="588" font-size="11">add-sandbox-card.md</text>
  <text x="30" y="616" class="mono" fill="#6b7280">08:59:00</text>
  <circle cx="96" cy="612" r="5" fill="#7c3aed"/>
  <text x="110" y="616" class="mono">step_up_op</text><text x="270" y="616" font-size="11">allow network registry.npmjs.org (approved)</text>
  <text x="30" y="644" class="mono" fill="#6b7280">08:47:12</text>
  <circle cx="96" cy="640" r="5" fill="#6b7280"/>
  <text x="110" y="644" class="mono">api_write</text><text x="270" y="644" font-size="11">action=stop client=gui-session-3</text>
  <text x="30" y="700" class="muted" font-size="10">Highlighted (orange): project_blocked, task_retry_exhausted, integration_conflicted,</text>
  <text x="30" y="714" class="muted" font-size="10">integration_verify_failed, touches_exceeded, archive_incomplete, review_error, session_reaped.</text>
  <text x="30" y="728" class="muted" font-size="10">Click a row → jumps to the project / task / sandbox it names.</text>

  <!-- PRs -->
  <rect x="648" y="402" width="616" height="344" rx="8" class="panel"/>
  <text x="662" y="426" class="h2">Pull requests · workingman-tui</text>
  <text x="980" y="426" class="muted" font-size="10">GET /projects/{id}/pulls · pr.updated</text>
  <rect x="662" y="438" width="588" height="128" rx="6" fill="#ffffff" stroke="#6d28d9"/>
  <text x="674" y="460" class="h3">slimslenderslacks/workingman #34</text>
  <rect x="900" y="447" width="44" height="18" rx="9" fill="#dcfce7" stroke="#15803d"/>
  <text x="910" y="460" font-size="10">open</text>
  <text x="1140" y="460" font-size="11" fill="#1d4ed8">open on GitHub ↗</text>
  <text x="674" y="482" class="muted" font-size="11">head c97c47ec · watching · poll ladder 2m→4m→[8m]→16m→32m→1h</text>
  <rect x="674" y="490" width="300" height="10" fill="#e5e7eb"/>
  <rect x="674" y="490" width="150" height="10" fill="#6d28d9"/>
  <text x="984" y="499" class="muted" font-size="10">next poll in 3m · baseline mcp</text>
  <text x="674" y="524" class="h3">Fix tasks from review</text>
  <text x="674" y="542" class="mono">fix-pr-34-comment-1201</text><text x="860" y="542" font-size="11">pr-comment · committed ✓</text>
  <text x="674" y="558" class="mono">push-pr-34</text><text x="860" y="558" font-size="11">pr-push · in commit queue #1</text>
  <rect x="662" y="578" width="146" height="28" rx="4" class="btn"/>
  <text x="676" y="596">Poll now (:review)</text>
  <text x="820" y="596" class="muted" font-size="10">enabled only on idle; writes review_now: true</text>
  <text x="662" y="634" class="muted" font-size="10">The GUI never calls GitHub itself: state is project.yaml pull_requests[] plus the</text>
  <text x="662" y="648" class="muted" font-size="10">daemon's review_poll; review_fix_cycles 1/10 and review_errors 0/5 shown as budgets.</text>

  <rect x="662" y="666" width="588" height="66" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="674" y="686" class="h3">Notifications (browser)</text>
  <text x="674" y="704" font-size="11">Desktop notification on: inbox request · project_blocked · PR merged.</text>
  <text x="674" y="720" class="muted" font-size="10">Complements, not replaces, osascript / WhatsApp / Signal / Slack channel fan-out.</text>
</svg>
