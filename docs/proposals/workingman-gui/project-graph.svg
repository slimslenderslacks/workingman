  <rect x="362" y="546" width="14" height="14" class="st-success"/><text x="382" y="558" font-size="11">success = queued for integration</text>
  <rect x="566" y="546" width="14" height="14" class="st-running"/><text x="586" y="558" font-size="11">running</text>
  <rect x="644" y="546" width="14" height="14" class="st-ready"/><text x="664" y="558" font-size="11">ready</text>
  <rect x="712" y="546" width="14" height="14" class="st-failed"/><text x="732" y="558" font-size="11">failed</text>
  <rect x="780" y="546" width="14" height="14" class="st-blocked"/><text x="800" y="558" font-size="11">blocked</text>
  <text x="846" y="558" font-size="10" class="muted">dashed = dep failed</text>

