  <text x="1026" y="406" font-size="11">control-package · 08:47</text>
  <circle cx="1010" cy="436" r="6" fill="#9ca3af"/>
  <text x="1026" y="440" class="muted" font-size="11">base 950a530 (project start)</text>

  <rect x="976" y="470" width="280" height="98" rx="4" class="note"/>
  <text x="986" y="488" font-size="11" font-weight="bold">Integration failures show here</text>
  <text x="986" y="504" font-size="10">conflict / verify_failed → task back to ready</text>
  <text x="986" y="518" font-size="10">(conflict re-run, badge on the graph node);</text>
  <text x="986" y="532" font-size="10">partial → project blocked. Source: task</text>
  <text x="986" y="546" font-size="10">integration{result,files,onto,output} and</text>
  <text x="986" y="560" font-size="10">queue.updated / task.status SSE events.</text>

