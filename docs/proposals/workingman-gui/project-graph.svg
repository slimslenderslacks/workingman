  <text x="282" y="351" class="muted" font-size="10">touches: snapshot.go</text>

  <rect x="270" y="440" width="170" height="58" rx="6" class="st-failed"/>
  <text x="282" y="460" class="h2">auth-token</text>
  <text x="282" y="477" font-size="11" fill="#b91c1c">✗ failed · attempt 2/3</text>
  <text x="282" y="491" class="muted" font-size="10">sandbox retained · Retry ▸</text>

  <!-- depth 1 -->
  <rect x="480" y="176" width="170" height="58" rx="6" class="st-success"/>
  <text x="492" y="196" class="h2">api-read-endpoints</text>
  <text x="492" y="213" font-size="11" fill="#0f766e">⧗ success · queue #1</text>
  <text x="492" y="227" class="muted" font-size="10">integrating now (commit agent)</text>

  <rect x="480" y="300" width="170" height="58" rx="6" class="st-success"/>
  <text x="492" y="320" class="h2">sse-events</text>
  <text x="492" y="337" font-size="11" fill="#0f766e">⧗ success · queue #2</text>
  <text x="492" y="351" class="muted" font-size="10">succeeded_at 09:31:05</text>

  <rect x="480" y="440" width="170" height="58" rx="6" class="st-running"/>
  <text x="492" y="460" class="h2">session-relay</text>
  <text x="492" y="477" font-size="11" fill="#1d4ed8">● running · 6m · turn 1</text>
  <text x="492" y="491" class="muted" font-size="10">sandbox gui-api-session-relay</text>

  <!-- depth 2 -->
  <rect x="690" y="236" width="170" height="58" rx="6" class="st-ready"/>
  <text x="702" y="256" class="h2">gui-shell</text>
  <text x="702" y="273" font-size="11" fill="#374151">○ ready · waiting_on</text>
  <text x="702" y="287" class="muted" font-size="10">api-read-endpoints, sse-events</text>

  <rect x="690" y="440" width="170" height="58" rx="6" class="st-ready" stroke-dasharray="5 3"/>
  <text x="702" y="460" class="h2">browser-login</text>
  <text x="702" y="477" font-size="11" fill="#374151">○ ready · waiting_on</text>
  <text x="702" y="491" class="muted" font-size="10">auth-token (failed)</text>

  <!-- edges -->
  <path d="M440,205 L478,205" class="edge" marker-end="url(#arrow)"/>
  <path d="M440,329 L478,329" class="edge" marker-end="url(#arrow)"/>
