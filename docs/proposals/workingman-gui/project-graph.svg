  <path d="M1030,272 L1014,272" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-q)"/>

  <line x1="1020" y1="318" x2="1256" y2="318" stroke="#d1d5db" stroke-dasharray="3 3"/>
  <text x="1030" y="334" class="muted" font-size="10">landed (newest first)</text>

  <circle cx="1010" cy="356" r="6" fill="#15803d"/>
