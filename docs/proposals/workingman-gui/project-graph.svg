  <text x="1035" y="79" class="muted">Review</text>
  <rect x="1092" y="62" width="88" height="26" rx="4" class="btn"/>
  <text x="1101" y="79">Queue intake</text>
  <rect x="1186" y="62" width="80" height="26" rx="4" class="btn"/>
  <text x="1192" y="79">Open shell ▾</text>
  <text x="1024" y="102" class="muted" font-size="10">Review greyed: only on idle (same refusal text as :review)</text>

  <!-- graph panel -->
  <rect x="248" y="110" width="700" height="470" class="panel"/>
  <text x="262" y="132" class="h2">Task graph</text>
  <text x="352" y="132" class="muted" font-size="11">GET /projects/{id}/graph · edges = depends_on · layout left→right by depth</text>

  <!-- column labels -->
  <text x="290" y="160" class="muted" font-size="10">depth 0</text>
  <text x="500" y="160" class="muted" font-size="10">depth 1</text>
  <text x="710" y="160" class="muted" font-size="10">depth 2</text>

  <!-- nodes: depth 0 -->
  <rect x="270" y="176" width="170" height="58" rx="6" class="st-committed"/>
  <text x="282" y="196" class="h2">control-package</text>
  <text x="282" y="213" font-size="11" fill="#15803d">✓ committed · 3f1a9c2</text>
  <text x="282" y="227" class="muted" font-size="10">areas: internal/control</text>

  <rect x="270" y="300" width="170" height="58" rx="6" class="st-committed"/>
  <text x="282" y="320" class="h2">snapshot-model</text>
