<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>workingman GUI wireframe: project view (task graph and commit queue)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #9ca3af; }
      .panel { fill: #f9fafb; stroke: #d1d5db; }
      .muted { fill: #6b7280; }
      .h1 { font-size: 18px; font-weight: bold; fill: #111827; }
      .h2 { font-size: 13px; font-weight: bold; fill: #111827; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 11px; }
      .btn { fill: #ffffff; stroke: #6b7280; }
      .btn-danger { fill: #fff7ed; stroke: #c2410c; }
      .edge { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .st-committed { fill: #dcfce7; stroke: #15803d; }
      .st-success { fill: #ccfbf1; stroke: #0f766e; }
      .st-running { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
      .st-ready { fill: #f3f4f6; stroke: #6b7280; }
      .st-failed { fill: #fee2e2; stroke: #b91c1c; }
      .st-blocked { fill: #ffedd5; stroke: #c2410c; }
      .note { fill: #fefce8; stroke: #ca8a04; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="1279" height="819" class="frame"/>

  <!-- top bar -->
  <rect x="0.5" y="0.5" width="1279" height="44" fill="#111827"/>
  <text x="18" y="28" fill="#ffffff" font-size="16" font-weight="bold">workingman</text>
  <text x="140" y="28" fill="#ffffff" font-weight="bold">Projects</text>
  <rect x="134" y="38" width="66" height="3" fill="#60a5fa"/>
  <text x="220" y="28" fill="#d1d5db">Sandboxes</text>
  <text x="310" y="28" fill="#d1d5db">Agents</text>
  <text x="380" y="28" fill="#d1d5db">Inbox</text>
  <circle cx="428" cy="24" r="8" fill="#f59e0b"/>
  <text x="425" y="28" fill="#111827" font-size="10" font-weight="bold">1</text>
  <text x="456" y="28" fill="#d1d5db">Timeline</text>
  <rect x="1010" y="12" width="256" height="22" rx="11" fill="#1f2937" stroke="#4b5563"/>
  <circle cx="1026" cy="23" r="5" fill="#22c55e"/>
  <text x="1038" y="27" fill="#d1d5db" font-size="11">daemon running · SSE live · seq 18241</text>

  <!-- left: work streams -->
  <rect x="12" y="56" width="220" height="752" class="panel"/>
  <text x="24" y="78" class="h2">Work streams</text>
  <rect x="24" y="88" width="196" height="24" rx="4" fill="#ffffff" stroke="#d1d5db"/>
  <text x="32" y="104" class="muted">filter…   status: any ▾</text>

  <rect x="24" y="122" width="196" height="54" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="34" y="141" class="h2">gui-api</text>
  <rect x="160" y="129" width="52" height="16" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="167" y="141" font-size="10" fill="#1d4ed8">working</text>
  <text x="34" y="160" class="muted" font-size="11">7 tasks · 2 queued · 1 running</text>
  <rect x="34" y="166" width="176" height="4" fill="#e5e7eb"/>
  <rect x="34" y="166" width="50" height="4" fill="#15803d"/>
  <rect x="84" y="166" width="50" height="4" fill="#0f766e"/>
  <rect x="134" y="166" width="25" height="4" fill="#1d4ed8"/>

  <rect x="24" y="184" width="196" height="54" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="34" y="203" class="h2">nightly-deps</text>
  <rect x="166" y="191" width="46" height="16" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="177" y="203" font-size="10" fill="#374151">idle</text>
  <text x="34" y="222" class="muted" font-size="11">cron · 1 missed tick</text>

  <rect x="24" y="246" width="196" height="54" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="34" y="265" class="h2">docs-refresh</text>
  <rect x="158" y="253" width="54" height="16" rx="8" fill="#ffedd5" stroke="#c2410c"/>
  <text x="164" y="265" font-size="10" fill="#c2410c">blocked</text>
  <text x="34" y="284" class="muted" font-size="11">wolf in flight · join ▸</text>

  <rect x="24" y="308" width="196" height="54" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="34" y="327" class="h2">workingman-tui</text>
  <rect x="160" y="315" width="52" height="16" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="166" y="327" font-size="10" fill="#6d28d9">PR #34</text>
  <text x="34" y="346" class="muted" font-size="11">idle · watching PR · poll 8m</text>

  <rect x="24" y="772" width="196" height="26" rx="4" class="btn"/>
  <text x="50" y="789">+ New project (project.md)</text>

  <!-- project header -->
  <text x="248" y="80" class="h1">gui-api</text>
  <rect x="322" y="65" width="62" height="20" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="333" y="79" fill="#1d4ed8">working</text>
  <text x="396" y="79" class="muted">branch</text>
  <text x="438" y="79" class="mono">gui-api</text>
  <text x="496" y="79" class="muted">· repos slimslenderslacks/workingman · max_parallel_tasks 2 · verify: go build ./...</text>

