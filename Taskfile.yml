version: '3'

tasks:
  default:
    deps: [build]

  build:
    desc: Build orch, acp-wrapper and op-read into the repo root
    deps: [orch, acp-wrapper, op-read]

  orch:
    desc: Build the orch daemon
    cmds:
      - go build -o orch ./cmd/orch
    sources:
      - cmd/orch/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - orch

  acp-wrapper:
    desc: Build the acp-wrapper host
    cmds:
      - go build -o acp-wrapper ./cmd/acp-wrapper
    sources:
      - cmd/acp-wrapper/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - acp-wrapper

  op-read:
    desc: Build op-read, which start.sh uses to load the signing key from 1Password (Go SDK, service account)
    cmds:
      - go build -o op-read ./cmd/op-read
    sources:
      - cmd/op-read/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - op-read

  test:
    desc: Run go vet and the Go test suite (mirrors ci.yml)
    cmds:
      - go vet ./...
      - go test -race -count=1 ./...

  check:ca:
    desc: "Prove sandboxes work with the extra CA: probes git/curl in a throwaway sandbox without and with it (task check:ca -- /path/to/ca.pem; default $WORKINGMAN_EXTRA_CA_CERTS)"
    cmds:
      - ./check-ca.sh {{.CLI_ARGS}}

  docs:
    desc: Regenerate docs/packages.md from the internal packages' doc.go comments
    cmds:
      - go run ./internal/tools/pkgdoc

  docs:check:
    desc: Fail if docs/packages.md is out of date with the package comments
    cmds:
      - task: docs
      - git diff --exit-code -- docs/packages.md

  clean:
    desc: Remove built binaries
    cmds:
      - rm -f orch acp-wrapper op-read
