version: '3'

tasks:
  default:
    deps: [build]

  build:
    desc: Build orch, acp-wrapper, op-read and post-office into the repo root
    deps: [orch, acp-wrapper, op-read, post-office]

  orch:
    desc: Build the orch daemon
    cmds:
      - go build -o orch ./cmd/orch
    sources:
      - cmd/orch/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - orch

  acp-wrapper:
    desc: Build the acp-wrapper host
    cmds:
      - go build -o acp-wrapper ./cmd/acp-wrapper
    sources:
      - cmd/acp-wrapper/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - acp-wrapper

  op-read:
    desc: Build op-read, which start.sh uses to load the signing key from 1Password (Go SDK, service account)
    cmds:
      - go build -o op-read ./cmd/op-read
    sources:
      - cmd/op-read/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - op-read

  post-office:
    desc: Build post-office, the agent messaging MCP server (docs/messaging-design.md §4)
    cmds:
      - go build -o post-office ./cmd/post-office
    sources:
      - cmd/post-office/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - post-office

  post-office:install:
    desc: Install post-office to ~/.local/bin and its launchd agent (macOS); run `post-office setup` first
    deps: [post-office]
    cmds:
      - mkdir -p "$HOME/.local/bin" "$HOME/Library/LaunchAgents" "$HOME/Library/Logs/workingman"
      - install -m 0755 post-office "$HOME/.local/bin/post-office"
      - sed "s|__HOME__|$HOME|g" launchd/com.workingman.post-office.plist > "$HOME/Library/LaunchAgents/com.workingman.post-office.plist"
      - launchctl bootout "gui/$(id -u)/com.workingman.post-office" 2>/dev/null || true
      - launchctl bootstrap "gui/$(id -u)" "$HOME/Library/LaunchAgents/com.workingman.post-office.plist"

  test:
    desc: Run go vet and the Go test suite (mirrors ci.yml)
    cmds:
      - go vet ./...
      - go test -race -count=1 ./...

  docs:
    desc: Regenerate docs/packages.md from the internal packages' doc.go comments
    cmds:
      - go run ./internal/tools/pkgdoc

  docs:check:
    desc: Fail if docs/packages.md is out of date with the package comments
    cmds:
      - task: docs
      - git diff --exit-code -- docs/packages.md

  clean:
    desc: Remove built binaries
    cmds:
      - rm -f orch acp-wrapper op-read post-office
